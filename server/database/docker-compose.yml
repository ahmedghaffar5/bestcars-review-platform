services:
  mongo_db:
    container_name: db_container
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nodeapp
    ports:
      - "3030:3030"
    environment:
      MONGO_URI: mongodb://mongo_db:27017/dealershipsDB
      PORT: 3030
    depends_on:
      mongo_db:
        condition: service_started

volumes:
  mongo_data:
