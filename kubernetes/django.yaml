apiVersion: apps/v1
kind: Deployment
metadata:
  name: bestcars-django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bestcars-django
  template:
    metadata:
      labels:
        app: bestcars-django
    spec:
      containers:
        - name: django
          image: bestcars-django:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: bestcars-django
spec:
  selector:
    app: bestcars-django
  ports:
    - port: 8000
      targetPort: 8000
