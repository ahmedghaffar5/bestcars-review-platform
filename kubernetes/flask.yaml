apiVersion: apps/v1
kind: Deployment
metadata:
  name: bestcars-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bestcars-flask
  template:
    metadata:
      labels:
        app: bestcars-flask
    spec:
      containers:
        - name: flask
          image: bestcars-flask:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: bestcars-flask
spec:
  selector:
    app: bestcars-flask
  ports:
    - port: 5000
      targetPort: 5000
