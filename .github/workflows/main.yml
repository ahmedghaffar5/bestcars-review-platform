name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flake8
      - run: >
          flake8 server scripts
          --exclude=server/frontend,server/.venv,server/djangoapp/migrations
          --max-line-length=120

  lint_js:
    name: Lint backend JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global jshint
      - run: jshint --config server/database/.jshintrc server/database/*.js

  django_tests:
    name: Django checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

  react_build:
    name: Build React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci --include=dev --no-audit --no-fund
      - name: Strict production build
        working-directory: server/frontend
        env:
          CI: 'true'
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: server/frontend/build/
          if-no-files-found: error
          retention-days: 3

  docker_smoke:
    name: Image and React asset smoke test
    needs: react_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: react-build
          path: server/frontend/build
      - name: Build Python image containing the React bundle
        run: docker build -t bestcars-ci server
      - name: Start disposable local CI container
        run: |
          KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$KEY"
          docker run -d --name bestcars-ci -p 127.0.0.1:18000:8000 \
            -e DJANGO_DEBUG=0 -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_SECRET_KEY="$KEY" bestcars-ci
      - name: Check rendered pages and actual JavaScript/CSS
        run: python scripts/smoke_http.py --base http://127.0.0.1:18000 --wait 90
      - name: Container logs
        if: always()
        run: docker logs bestcars-ci
      - name: Remove only this disposable CI container
        if: always()
        run: docker rm -f bestcars-ci
