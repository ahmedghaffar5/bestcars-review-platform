name: Lint Code

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flake8
        run: python -m pip install flake8
      - name: Run Flake8
        run: >
          flake8 server
          --exclude=server/frontend,server/.venv,server/djangoapp/migrations
          --max-line-length=120

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JSHint
        run: npm install --global jshint
      - name: Run JSHint
        run: jshint --config server/database/.jshintrc server/database/*.js

  react_build:
    name: Build React Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build with strict CI warnings
        env:
          CI: true
        run: npm run build

  django_tests:
    name: Run Django Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check and test
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
